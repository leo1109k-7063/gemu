
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오목</title>
  <link rel="stylesheet" href="assets/css/design.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/game-new.css">
  <style>
    [hidden] {
      display: none !important;
    }

    #online-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <main class="new-wrap">
    <header class="new-head">
      <a href="index.html">← 홈</a>
      <h1>오목</h1>

      <select id="mode" aria-label="대국 모드">
        <option value="ai">컴퓨터 대전</option>
        <option value="pvp">1대1 대전 (같은 기기)</option>
        <option value="online">온라인 1대1</option>
      </select>
    </header>

    <div class="new-game-layout">
      <div id="board" class="new-board" aria-label="오목판"></div>

      <aside class="new-card" style="min-width:220px;flex:1">
        <h2 id="status">흑 차례</h2>

        <p>
          흑: 플레이어 1 · 백:
          <span id="opponent">컴퓨터</span>
        </p>

        <p>
          흑 승 <b id="winsB">0</b>
          · 백 승 <b id="winsW">0</b>
        </p>

        <div id="online-controls" hidden>
          <button id="find-online" class="btn btn-primary" type="button">
            상대 찾기
          </button>
          <button id="cancel-online" class="btn" type="button">
            대기 취소
          </button>
        </div>

        <button id="reset" class="btn btn-primary" type="button">
          새 대국
        </button>

        <p class="small-note">
          컴퓨터 대전과 같은 기기 1대1은 기존 방식으로 진행됩니다.
          온라인 1대1은 대기열에 들어온 두 명이 자동으로 매칭됩니다.
        </p>
      </aside>
    </div>
  </main>

  <script type="module" src="assets/js/pages/new-omok.js"></script>
</body>
</html>

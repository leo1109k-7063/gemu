
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오목 솔리테어 | 게임 놀이터</title>
  <link rel="stylesheet" href="assets/css/design.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/game-new.css">
</head>
<body data-omok-mode="ai">
  <main class="new-wrap">
    <header class="new-head">
      <a href="classic-game-center.html">← 클래식 게임 센터</a>
      <h1>오목 솔리테어</h1>
    </header>

    <nav class="class-tabs glass omok-modes" aria-label="오목 게임 모드">
      <a class="class-tab press on" href="omok.html" aria-current="page">오목 솔리테어</a>
      <a class="class-tab press" href="omok-local.html">오목 로컬플레이</a>
      <a class="class-tab press" href="omok-online.html">오목 온라인</a>
    </nav>

    <div class="new-game-layout">
      <div id="board" class="new-board" aria-label="오목판"></div>
      <aside class="new-card" style="min-width:220px;flex:1">
        <h2 id="status">흑 차례</h2>
        <p>흑: 플레이어 · 백: <span id="opponent">컴퓨터</span></p>
        <p>흑 승 <b id="winsB">0</b> · 백 승 <b id="winsW">0</b></p>
        <button id="reset" class="btn btn-primary">새 대국</button>
        <p class="small-note">기존 오목 컴퓨터 AI와 대결합니다.</p>
      </aside>
    </div>
  </main>
  <script type="module" src="assets/js/pages/new-omok.js"></script>

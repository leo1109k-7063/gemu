<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>교사 관리</title>
  <link rel="stylesheet" href="../assets/css/design.css">
  <link rel="stylesheet" href="../assets/css/site.css">
  <link rel="stylesheet" href="../assets/css/game-new.css">
  <style>
    .account-list{display:grid;gap:8px}
    .account-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border:1px solid #ddd;border-radius:10px}
    .account-row small{display:block;opacity:.7}
    .error-text{color:#b42318}
    .teacher-actions{display:flex;gap:8px;flex-wrap:wrap}
  </style>
</head>
<body>
  <main class="new-wrap">
    <header class="new-head">
      <a href="../index.html">← 게임으로</a>
      <h1>교사 페이지</h1>
    </header>

    <section id="gate" class="new-card">
      <h2>교사 코드</h2>
      <form id="gateform">
        <input id="code" type="password" inputmode="numeric" maxlength="6"
          placeholder="출입 코드" required>
        <button class="btn btn-primary" type="submit">확인</button>
      </form>
      <p id="gateStatus" role="status"></p>
    </section>

    <section id="panel" class="hidden">
      <div class="new-card">
        <h2>계정 목록 <span id="accountCount">(0)</span></h2>
        <div class="teacher-actions">
          <button id="refreshAccounts" class="btn btn-line" type="button">목록 새로고침</button>
        </div>
        <p id="accountStatus" role="status"></p>
        <div id="accountList" class="account-list"></div>
      </div>

      <div class="new-card">
        <h2>코인 지급</h2>
        <form id="grantform">
          <input id="target" placeholder="학생 닉네임" required>
          <input id="amount" type="number" min="1" max="100000" value="10" required>
          <button class="btn btn-primary" type="submit">코인 지급</button>
        </form>
        <p id="grantstatus" role="status"></p>
      </div>

      <div class="new-card">
        <h2>게임 ON/OFF</h2>
        <p><label><input type="checkbox" id="omokToggle" checked> 오목 사용</label></p>
        <p><label><input type="checkbox" id="rkToggle" checked> 루미큐브 사용</label></p>
        <button id="saveSettings" class="btn btn-primary" type="button">설정 저장</button>
        <p id="settingsStatus" role="status"></p>
      </div>

      <div class="new-card">
        <h2>홈 바로가기 표시 계정</h2>
        <p>선택한 계정으로 로그인했을 때만 홈에 교사 페이지 바로가기가 표시돼요.</p>
        <select id="teacherShortcutAccount" style="width:100%">
          <option value="">바로가기 표시 안 함</option>
        </select>
        <p class="small-note">이 설정은 바로가기 표시만 제어하며, 페이지 자체의 접근 권한을 보호하는 기능은 아닙니다.</p>
      </div>

      <div class="new-card">
        <h2>소유자 전용 안내</h2>
        <p>소유자 코드를 입력해야 열리는 기능 안내 페이지예요.</p>
        <a href="owner-tools.html">소유자 도구 안내 열기 →</a>
      </div>
    </section>
  </main>

  <script type="module" src="../assets/js/pages/new-teacher.js"></script>
</body>
</html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사 관리</title><link rel="stylesheet" href="../assets/css/design.css"><link rel="stylesheet" href="../assets/css/site.css"><link rel="stylesheet" href="../assets/css/game-new.css"></head><body><main class="new-wrap"><header class="new-head"><a href="../index.html">← 게임으로</a><h1>교사 페이지</h1></header><section id="gate" class="new-card"><h2>교사 코드</h2><form id="gateform"><input id="code" type="password" inputmode="numeric" maxlength="6" placeholder="출입 코드" required><button class="btn btn-primary">확인</button></form><p class="small-note">코드 확인은 이 프로토타입의 브라우저 안에서만 이뤄집니다.</p></section><section id="panel" class="hidden"><div class="new-card"><h2>코인 지급</h2><form id="grantform"><input id="target" placeholder="학생 닉네임" required><input id="amount" type="number" min="1" max="100000" value="10" required><button class="btn btn-primary">코인 지급</button></form><p id="grantstatus"></p></div><div class="new-card"><h2>게임 ON/OFF</h2><p><label><input type="checkbox" id="omokToggle" checked> 오목 사용</label></p><p><label><input type="checkbox" id="rkToggle" checked> 루미큐브 사용</label></p><button id="saveSettings" class="btn btn-primary">설정 저장</button><p id="settingsStatus"></p></div></section></main><script type="module" src="../assets/js/pages/new-teacher.js"></script></body></html>

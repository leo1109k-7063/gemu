<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>교사 관리</title>
  <link rel="stylesheet" href="../assets/css/design.css">
  <link rel="stylesheet" href="../assets/css/site.css">
  <link rel="stylesheet" href="../assets/css/game-new.css">
  <style>
    .account-list{display:grid;gap:8px}
    .account-row{
      display:flex;justify-content:space-between;gap:12px;
      align-items:center;padding:10px 12px;
      border:1px solid #ddd;border-radius:10px
    }
    .account-row small{display:block;opacity:.7}
    .error-text{color:#b42318}
    .teacher-actions{display:flex;gap:8px;flex-wrap:wrap}
  </style>
</head>
<body>
  <main class="new-wrap">
    <header class="new-head">
      <a href="../index.html">← 게임으로</a>
      <h1>교사 페이지</h1>
    </header>

    <section id="gate" class="new-card">
      <h2>교사 코드</h2>
      <form id="gateform">
        <input id="code" type="password" inputmode="numeric"
          maxlength="6" placeholder="출입 코드" required>
        <button class="btn btn-primary" type="submit">확인</button>
      </form>
      <p class="small-note">교사 기능은 서버에서 코드를 확인합니다.</p>
      <p id="gateStatus" role="status"></p>
    </section>

    <section id="panel" class="hidden">
      <div class="new-card">
        <h2>계정 목록 <span id="accountCount">(0)</span></h2>
        <p class="small-note">닉네임과 현재 코인 수입니다.</p>
        <div class="teacher-actions">
          <button id="refreshAccounts" class="btn btn-line" type="button">
            목록 새로고침
          </button>
        </div>
        <p id="accountStatus" role="status"></p>
        <div id="accountList" class="account-list"></div>
      </div>

      <div class="new-card">
        <h2>코인 지급</h2>
        <form id="grantform">
          <input id="target" placeholder="학생 닉네임" required>
          <input id="amount" type="number" min="1" max="100000"
            value="10" required>
          <button class="btn btn-primary" type="submit">코인 지급</button>
        </form>
        <p id="grantstatus" role="status"></p>
      </div>

      <div class="new-card">
        <h2>게임 ON/OFF</h2>
        <p>
          <label>
            <input type="checkbox" id="omokToggle" checked>
            오목 사용
          </label>
        </p>
        <p>
          <label>
            <input type="checkbox" id="rkToggle" checked>
            루미큐브 사용
          </label>
        </p>
        <button id="saveSettings" class="btn btn-primary" type="button">
          설정 저장
        </button>
        <p id="settingsStatus" role="status"></p>
      </div>
    </section>
  </main>

  <script type="module" src="../assets/js/pages/new-teacher.js"></script>
</body>
</html>

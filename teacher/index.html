
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>교사 관리</title>
  <link rel="stylesheet" href="../assets/css/design.css">
  <link rel="stylesheet" href="../assets/css/site.css">
  <link rel="stylesheet" href="../assets/css/game-new.css">
  <style>
    .account-list{display:grid;gap:8px}
    .account-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border:1px solid #ddd;border-radius:10px}
    .account-row small{display:block;opacity:.7}
    .error-text{color:#b42318}
    .teacher-actions{display:flex;gap:8px;flex-wrap:wrap}
    .account-name{border:0;background:transparent;padding:0;font:inherit;font-weight:700;text-align:left;cursor:pointer;color:inherit}
    .account-detail{margin-top:12px;padding:14px;border:1px solid #ddd;border-radius:12px}
    .account-detail[hidden]{display:none}
    .role-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    #grantReason{display:block;width:100%;box-sizing:border-box;margin:8px 0 12px}
  </style>
</head>
<body>
<main class="new-wrap">
  <header class="new-head">
    <a href="../index.html">← 게임으로</a>
    <h1>교사 페이지</h1>
  </header>

  <section id="gate" class="new-card">
    <h2>교사 코드</h2>
    <form id="gateform">
      <input id="code" type="password" inputmode="numeric" maxlength="6" placeholder="출입 코드" required>
      <button class="btn btn-primary">확인</button>
    </form>
    <p class="small-note">교사 기능은 서버에서 코드를 확인합니다.</p>
    <p id="gateStatus" role="status"></p>
  </section>

  <section id="panel" class="hidden">
    <div class="new-card">
      <h2>계정 목록 <span id="accountCount">(0)</span></h2>
      <p class="small-note">계정 이름을 누르면 마이페이지 정보와 권한 지정 기능을 열 수 있습니다.</p>

      <button id="refreshAccounts" class="btn btn-line" type="button">목록 새로고침</button>
      <p id="accountStatus" role="status"></p>
      <div id="accountList" class="account-list"></div>

      <section id="accountDetail" class="account-detail" hidden aria-live="polite">
        <h3 id="detailNickname"></h3>
        <p>보유 코인: <strong id="detailCoins">0</strong></p>
        <p id="detailRoles" class="small-note"></p>

        <label for="roleDeveloperCode">개발자 코드</label>
        <input id="roleDeveloperCode" type="password" autocomplete="off" placeholder="개발자 코드">

        <button id="assignDeveloper" class="btn btn-primary" type="button">이 계정을 개발자로 지정</button>

        <label for="roleTeacherCode">교사 코드</label>
        <input id="roleTeacherCode" type="password" autocomplete="off" placeholder="교사 코드">

        <button id="assignTeacher" class="btn btn-primary" type="button">이 계정을 교사로 지정</button>

        <p id="roleStatus" role="status"></p>
        <button id="closeAccountDetail" class="btn btn-line" type="button">닫기</button>
      </section>
    </div>

    <div class="new-card">
      <h2>코인 지급</h2>
      <form id="grantform">
        <label for="target">학생 닉네임</label>
        <input id="target" placeholder="학생 닉네임" required>

        <label for="amount">지급할 코인 수</label>
        <input id="amount" type="number" min="1" max="100000" value="10" required>

        <label for="grantReason">지급 코멘트 (필수)</label>
        <textarea
          id="grantReason"
          maxlength="200"
          rows="3"
          placeholder="예: 수업 참여를 열심히 해서 지급"
          required
        ></textarea>

        <button class="btn btn-primary">코인 지급</button>
      </form>
      <p id="grantstatus" role="status"></p>
    </div>

    <div class="new-card">
      <h2>게임 ON/OFF</h2>
      <p><label><input type="checkbox" id="omokToggle" checked> 오목 사용</label></p>
      <p><label><input type="checkbox" id="rkToggle" checked> 루미큐브 사용</label></p>
      <button id="saveSettings" class="btn btn-primary" type="button">설정 저장</button>
      <p id="settingsStatus" role="status"></p>
    </div>
  </section>
</main>

<script type="module" src="../assets/js/pages/new-teacher.js"></script>
</body>
</html>

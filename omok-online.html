<main class="omok-page" data-omok-mode="online">
  <h1>오목 온라인</h1>
  <p>상대 플레이어를 찾아 온라인 대전을 시작하세요.</p>

  <section id="online-controls">
    <button id="find-online" type="button">상대 찾기</button>
    <button id="cancel-online" type="button" hidden>매칭 취소</button>
  </section>

  <p id="status">상대 찾기를 눌러 주세요.</p>
  <p id="opponent"></p>

  <div id="board" aria-label="온라인 오목 게임판"></div>

  <div class="game-info">
    <p>흑돌 승리: <span id="winsB">0</span></p>
    <p>백돌 승리: <span id="winsW">0</span></p>
  </div>

  <button id="reset" type="button">다시 시작</button>
</main>

<script type="module" src="assets/js/pages/new-omok.js"></script>

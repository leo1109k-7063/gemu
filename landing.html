import { SUPABASE_URL, SUPABASE_ANON_KEY } from './assets/js/config.js';
window.claimLandingReward = async (score, matchId) => {
  const status = document.getElementById('landing-reward-status');
  const notify = message => { if(status && status.isConnected) status.textContent = message; };
  let profile;
  try { profile = JSON.parse(localStorage.getItem('arcade-profile') || 'null'); } catch { profile = null; }
  if (!profile?.nickname) { notify('로그인 후 70점 이상 달성하면 5코인을 받을 수 있어요.'); return; }
  try {
    const response = await fetch(`${SUPABASE_URL.replace(/\/$/, '')}/rest/v1/rpc/claim_landing_reward`, {
      method: 'POST',
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_nickname: profile.nickname, p_score: score, p_match_id: matchId })
    });
    const result = await response.json().catch(() => null);
    if (!response.ok || result?.ok !== true) throw new Error(result?.message || '코인 지급 서버 설정을 확인해 주세요.');
    if (result.duplicate) { notify('이미 지급된 착륙 기록입니다.'); return; }
    profile.coins = Number(result.coins);
    localStorage.setItem('arcade-profile', JSON.stringify(profile));
    notify('🪙 착륙 성공! 5코인이 지급되었어요.');
  } catch (error) {
    console.error('착륙 보상 오류:', error);
    notify(`코인 지급 실패: ${error.message}`);
  }
};
</script>
